<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클래스 타이머</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Inter 폰트 적용 및 기본 스타일 */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            min-height: 100vh;
        }
        .timer-display {
            font-size: clamp(3rem, 15vw, 10rem); /* 화면 크기에 따라 반응형으로 글자 크기 조정 */
            font-weight: 700;
            line-height: 1;
            transition: color 0.3s ease;
        }
        .control-panel {
            grid-template-columns: repeat(3, 1fr);
        }
        /* 로딩 스피너 애니메이션 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div id="app-container" class="bg-white p-6 md:p-10 rounded-xl shadow-2xl w-full max-w-lg text-center transform transition duration-500 hover:scale-[1.02]">

        <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-3">
            🕒 수업 시간 타이머
        </h1>

        <p id="user-id-display" class="text-sm text-gray-500 mb-4 truncate">
            사용자 ID: 로컬 모드 작동 중
        </p>

        <div id="time-display" class="timer-display text-blue-600 my-8">
            05:00
        </div>

        <div id="settings-area" class="flex justify-center items-center space-x-2 mb-8 p-4 bg-blue-50 rounded-lg">
            <input type="number" id="minutes-input" value="5" min="0" max="99" class="w-16 p-2 text-lg text-center border-2 border-blue-300 rounded-lg focus:outline-none focus:border-blue-500" aria-label="Minutes">
            <span class="text-xl font-bold text-gray-700">분</span>
            <input type="number" id="seconds-input" value="0" min="0" max="59" class="w-16 p-2 text-lg text-center border-2 border-blue-300 rounded-lg focus:outline-none focus:border-blue-500" aria-label="Seconds">
            <span class="text-xl font-bold text-gray-700">초</span>
            <button id="set-button" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 transform hover:scale-105">
                설정
            </button>
        </div>

        <div id="controls" class="grid grid-cols-3 gap-3 md:gap-5">
            <button id="start-button" class="col-span-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-150 transform hover:scale-105 disabled:bg-gray-400">
                시작
            </button>
            <button id="pause-button" class="col-span-1 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-150 transform hover:scale-105 disabled:bg-gray-400" disabled>
                일시정지
            </button>
            <button id="reset-button" class="col-span-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-150 transform hover:scale-105 disabled:bg-gray-400">
                재설정
            </button>
        </div>

        <div id="status-message" class="mt-6 h-6 text-sm">
            <div id="loading-indicator" class="flex items-center justify-center space-x-2 text-blue-600" style="display: none;">
                <div class="spinner w-4 h-4 rounded-full border-2 border-transparent"></div>
                <span>데이터 동기화 중...</span>
            </div>
            <p id="error-message" class="text-red-500" style="display: none;"></p>
        </div>
    </div>

    <script type="module">
        // Firebase Core Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =======================================================================
        // 1. 전역 상수 및 변수 설정
        // =======================================================================

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'class-timer-default';
        
        // 파이어베이스 설정 값 안전하게 파싱 (실패 시 null 처리)
        let firebaseConfig = null;
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.warn("Firebase 설정 파싱 실패, 로컬 모드로 전환합니다.");
        }
        
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        const TIMER_DOC_PATH = `artifacts/${appId}/public/data/classTimer/timerState`;
        const DEFAULT_DURATION_SECONDS = 300; // 기본 5분

        // UI 요소
        const timeDisplay = document.getElementById('time-display');
        const startButton = document.getElementById('start-button');
        const pauseButton = document.getElementById('pause-button');
        const resetButton = document.getElementById('reset-button');
        const setButton = document.getElementById('set-button');
        const minutesInput = document.getElementById('minutes-input');
        const secondsInput = document.getElementById('seconds-input');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorMessage = document.getElementById('error-message');
        const userIdDisplay = document.getElementById('user-id-display');

        // 로컬 상태 변수
        let db = null, auth = null;
        let isAuthReady = false;
        let userId = null;
        let tickInterval = null;
        
        // Firestore 및 로컬 공용 타이머 상태
        let currentTimerState = {
            status: 'STOPPED', // RUNNING, PAUSED, STOPPED, FINISHED
            totalDurationSeconds: DEFAULT_DURATION_SECONDS,
            startTimeMs: 0,
            pausedTimeRemainingSeconds: DEFAULT_DURATION_SECONDS,
        };

        // =======================================================================
        // 2. 유틸리티 함수
        // =======================================================================
        
        function formatTime(totalSeconds) {
            const safeSeconds = Math.max(0, Math.floor(totalSeconds));
            const min = Math.floor(safeSeconds / 60);
            const sec = safeSeconds % 60;
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function updateButtonStates() {
            const status = currentTimerState.status;
            
            startButton.disabled = (status === 'RUNNING' || status === 'FINISHED');
            pauseButton.disabled = (status !== 'RUNNING');
            resetButton.disabled = (status === 'STOPPED' || status === 'FINISHED');

            setButton.disabled = (status !== 'STOPPED' && status !== 'FINISHED');
            minutesInput.disabled = setButton.disabled;
            secondsInput.disabled = setButton.disabled;

            if (status === 'PAUSED') {
                startButton.textContent = '계속';
            } else if (status === 'FINISHED') {
                startButton.textContent = '완료됨';
            } else {
                startButton.textContent = '시작';
            }
        }

        function updateDisplay(remainingSeconds) {
            const timeStr = formatTime(remainingSeconds);
            timeDisplay.textContent = timeStr;
            
            if (remainingSeconds <= 0) {
                timeDisplay.classList.remove('text-blue-600');
                timeDisplay.classList.add('text-red-600', 'animate-pulse');
            } else {
                timeDisplay.classList.remove('text-red-600', 'animate-pulse');
                timeDisplay.classList.add('text-blue-600');
            }
        }

        function calculateRemainingTime() {
            const state = currentTimerState;
            const now = Date.now();
            let remainingSeconds = 0;

            if (state.status === 'RUNNING') {
                const elapsedMs = now - state.startTimeMs;
                remainingSeconds = state.totalDurationSeconds - (elapsedMs / 1000);
            } else {
                remainingSeconds = state.pausedTimeRemainingSeconds;
            }

            if (remainingSeconds <= 0 && state.status === 'RUNNING') {
                remainingSeconds = 0;
                // 타이머 종료 상태 반영
                handleTimerFinished();
            }

            return remainingSeconds;
        }

        function handleTimerFinished() {
            if (db && userId) {
                setTimerState({
                    status: 'FINISHED',
                    pausedTimeRemainingSeconds: 0
                });
            } else {
                currentTimerState.status = 'FINISHED';
                currentTimerState.pausedTimeRemainingSeconds = 0;
                updateButtonStates();
                tick();
            }
        }

        function tick() {
            const remainingSeconds = calculateRemainingTime();
            updateDisplay(remainingSeconds);

            if (remainingSeconds <= 0 || currentTimerState.status === 'FINISHED' || currentTimerState.status === 'STOPPED') {
                if (tickInterval) {
                    clearInterval(tickInterval);
                    tickInterval = null;
                }
            }
        }

        // =======================================================================
        // 3. 데이터 제어 함수 (온라인/오프라인 하이브리드 지원)
        // =======================================================================

        async function setTimerState(updates) {
            // 로컬 상태는 항상 즉시 업데이트하여 반응성 확보
            currentTimerState = { ...currentTimerState, ...updates };

            // 파이어베이스가 정상 연결된 상태일 때만 서버에 업로드
            if (db && userId) {
                try {
                    await setDoc(doc(db, TIMER_DOC_PATH), currentTimerState, { merge: true });
                } catch (e) {
                    console.error("Firestore 업데이트 오류:", e);
                }
            } else {
                // 로컬 모드일 때 자체 인터벌 및 UI 관리
                updateButtonStates();
                if (currentTimerState.status === 'RUNNING' && !tickInterval) {
                    tickInterval = setInterval(tick, 1000);
                } else if (currentTimerState.status !== 'RUNNING') {
                    if (tickInterval) {
                        clearInterval(tickInterval);
                        tickInterval = null;
                    }
                    tick();
                }
            }
        }

        function syncTimerState() {
            if (!db) return;

            const timerDocRef = doc(db, TIMER_DOC_PATH);
            loadingIndicator.style.display = 'flex';

            onSnapshot(timerDocRef, (docSnapshot) => {
                loadingIndicator.style.display = 'none';

                if (docSnapshot.exists()) {
                    const data = docSnapshot.data();
                    currentTimerState = { ...currentTimerState, ...data };
                } else {
                    setTimerState(currentTimerState);
                }

                updateButtonStates();
                
                if (currentTimerState.status === 'RUNNING' && !tickInterval) {
                    tickInterval = setInterval(tick, 1000);
                } else if (currentTimerState.status !== 'RUNNING') {
                    if (tickInterval) {
                        clearInterval(tickInterval);
                        tickInterval = null;
                    }
                    tick();
                }
            }, (error) => {
                console.warn("Firestore 동기화 실패 (로컬 모드로 계속 작동):", error);
                loadingIndicator.style.display = 'none';
            });
        }
        
        // =======================================================================
        // 4. 이벤트 핸들러
        // =======================================================================

        async function handleStart() {
            if (currentTimerState.status === 'RUNNING') return;
            
            const now = Date.now();
            let updates = {};

            if (currentTimerState.status === 'PAUSED') {
                updates = {
                    status: 'RUNNING',
                    startTimeMs: now - (currentTimerState.totalDurationSeconds - currentTimerState.pausedTimeRemainingSeconds) * 1000,
                    pausedTimeRemainingSeconds: 0 
                };
            } else if (currentTimerState.status === 'STOPPED' || currentTimerState.status === 'FINISHED') {
                updates = {
                    status: 'RUNNING',
                    startTimeMs: now,
                    pausedTimeRemainingSeconds: 0 
                };
            }
            
            await setTimerState(updates);
        }

        async function handlePause() {
            if (currentTimerState.status !== 'RUNNING') return;
            const remainingSeconds = calculateRemainingTime();

            await setTimerState({
                status: 'PAUSED',
                pausedTimeRemainingSeconds: remainingSeconds
            });
        }

        async function handleReset() {
            if (currentTimerState.status === 'STOPPED') return;

            await setTimerState({
                status: 'STOPPED',
                pausedTimeRemainingSeconds: currentTimerState.totalDurationSeconds,
                startTimeMs: 0
            });
        }

        async function handleSetTime() {
            if (currentTimerState.status !== 'STOPPED' && currentTimerState.status !== 'FINISHED') return;

            const min = parseInt(minutesInput.value) || 0;
            const sec = parseInt(secondsInput.value) || 0;
            const newDuration = (min * 60) + sec;

            if (newDuration <= 0) {
                alert("타이머는 0초보다 길게 설정해야 합니다.");
                return;
            }

            await setTimerState({
                totalDurationSeconds: newDuration,
                pausedTimeRemainingSeconds: newDuration,
                status: 'STOPPED',
                startTimeMs: 0
            });

            updateDisplay(newDuration);
            updateButtonStates();
        }

        // =======================================================================
        // 5. Firebase 초기화 안전 제어
        // =======================================================================
        
        async function setupFirebase() {
            // 주입된 설정 정보에 핵심 값이 없으면 바로 로컬 모드로 작동시킴
            if (!firebaseConfig || !firebaseConfig.projectId) {
                console.log("Firebase 키가 제공되지 않았습니다. 일반 로컬 타이머 모드로 전환합니다.");
                userIdDisplay.textContent = "모드: 로컬 타이머 (단독 실행)";
                updateButtonStates();
                tick();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                setLogLevel('Error'); // 디버그 에러 로그 최소화
                await setPersistence(auth, browserLocalPersistence);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        userIdDisplay.textContent = `사용자 ID (공유용): ${userId}`;
                        isAuthReady = true;
                        syncTimerState();
                    } else {
                        userIdDisplay.textContent = '모드: 로컬 타이머';
                        updateButtonStates();
                        tick();
                    }
                });
                
            } catch (error) {
                console.warn("Firebase 연결 실패, 로컬 타이머로 전환 완료.");
                userIdDisplay.textContent = "모드: 로컬 타이머";
                db = null;
                auth = null;
                updateButtonStates();
                tick();
            }
        }

        // =======================================================================
        // 6. 이벤트 리스너 및 초기 실행
        // =======================================================================
        
        startButton.addEventListener('click', handleStart);
        pauseButton.addEventListener('click', handlePause);
        resetButton.addEventListener('click', handleReset);
        setButton.addEventListener('click', handleSetTime);

        window.onload = setupFirebase;
    </script>
</body>
</html>
